<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Lila — The Flower</title>

<!--
  ============================================================================
  WHAT THIS PAGE IS
  ============================================================================
  This is the "one more thing" page linked at the end of index.html.

  The flower is NOT a generic rose/tulip clipart — it's a hand-built,
  layered peony, drawn entirely in SVG and grown petal-by-petal with CSS
  animation, then given one full spin, before the closing line fades in.
  Peonies were chosen deliberately: in flower symbolism they represent
  romance, honor, and a bond that lasts — fitting for a "one more mile"
  kind of love.

  HOW TO CUSTOMIZE:
  - The closing text is in the <h1 id="flower-text"> tag below.
  - Petal counts, colors, and timing are all controlled from flower.js —
    look for the CONFIG block at the top of that file.
  ============================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="flower.css" />
</head>
<body>

  <a href="index.html" class="back-link" aria-label="Back to the letter">← back</a>

  <div class="flower-stage">
    <svg id="flower-svg" viewBox="0 0 500 620" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Outer petal color: deep rose at the base fading to soft blush at the tip -->
        <linearGradient id="petalGradOuter" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#b83368" />
          <stop offset="100%" stop-color="#f6cfe0" />
        </linearGradient>
        <!-- Middle layer: slightly warmer -->
        <linearGradient id="petalGradMid" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#c9457c" />
          <stop offset="100%" stop-color="#f9dcea" />
        </linearGradient>
        <!-- Inner layer: palest, near the golden heart -->
        <linearGradient id="petalGradInner" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#d9709e" />
          <stop offset="100%" stop-color="#fff0f6" />
        </linearGradient>
        <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f6dfa1" />
          <stop offset="100%" stop-color="#cf9b3f" />
        </radialGradient>
      </defs>

      <!-- Stem: drawn stroke-first via stroke-dashoffset animation in CSS -->
      <path id="stem" d="M250,610 C 246,520 258,430 250,340" fill="none" stroke="#5f8a5a" stroke-width="6" stroke-linecap="round" />

      <!-- Two simple leaves along the stem, faded/scaled in via CSS -->
      <path id="leaf-left" class="leaf" d="M250,470 C 190,460 160,500 150,540 C 210,545 245,510 250,470 Z" fill="#6ea566" />
      <path id="leaf-right" class="leaf" d="M250,410 C 300,398 335,425 348,458 C 292,468 258,445 250,410 Z" fill="#7fb476" />

      <!-- Flower head: petal layers are generated by flower.js and appended
           into these three empty groups, all centered on (250, 300).
           They're wrapped in #flower-head-group so the finale "spin" only
           rotates the bloom itself, never the stem. -->
      <g id="flower-head-group">
        <g id="petals-outer"></g>
        <g id="petals-mid"></g>
        <g id="petals-inner"></g>
        <!-- Flower heart / stamens, also generated by flower.js -->
        <g id="flower-heart"></g>
      </g>
    </svg>
  </div>

  <h1 id="flower-text" class="flower-text">For the woman that deserves the most flowers but I am not able to give it due to the distance and restrictions.</h1>

  <script src="flower.js"></script>
</body>
</html>
